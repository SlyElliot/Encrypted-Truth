<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Truth</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #0d0d0d;
            color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        .title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 5px;
        }

        .row.selected {
            border: 2px solid #0f0;
            padding: 2px;
            background: rgba(0, 255, 0, 0.1);
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px #0f0; }
            to { box-shadow: 0 0 20px #0f0; }
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #111;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #0f0;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .cell.correct {
            background: #0f0;
            color: #111;
            animation: flicker 0.5s ease-in-out;
        }

        .cell.present {
            background: #ff0;
            color: #111;
        }

        .cell.incorrect {
            background: #900;
            color: #fff;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .leaderboard {
            margin-top: 20px;
            color: #0f0;
        }

        .code-input {
            margin-top: 10px;
            font-size: 1.2rem;
            background: #111;
            color: #0f0;
            border: 2px solid #333;
            padding: 5px;
            text-align: center;
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 2px 2px #0f0, -2px -2px #111; }
            50% { text-shadow: -2px -2px #0f0, 2px 2px #111; }
        }

    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">Encrypted Truth</div>
        <div class="grid" id="grid"></div>
        <input class="code-input" id="input" placeholder="Enter hacker name...">
        <button id="submit" style="margin-top: 10px;">Submit</button>
        <div id="message"></div>
        <div class="leaderboard" id="leaderboard">
            <h2>Top Codebreakers</h2>
            <ol id="scoreboard"></ol>
        </div>
        <div class="footer">Follow the trail. The truth awaits.</div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://tlrpfnlefgfodhmclbtp.supabase.co'; // Replace with your Supabase URL
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRscnBmbmxlZmdmb2RobWNsYnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzUzMzQ2ODgsImV4cCI6MjA1MDkxMDY4OH0.GoUkXylqpFnACpg7Yz3WyuSOpJUYPfC_hE8e2FfZihE'; // Replace with your Supabase anon key
        const supabase = createClient(supabaseUrl, supabaseKey);

        const hackerNames = ["Lucifer", "DeadShot", "Ratio", "PhantomX", "ShadowWolf", "RemainingYears", "yamuware6713103", "bunkai123241", "TheCollector"];
        const grid = document.getElementById("grid");
        const input = document.getElementById("input");
        const submit = document.getElementById("submit");
        const message = document.getElementById("message");
        const leaderboard = document.getElementById("scoreboard");
        let attempts = 0;
        let selectedRowIndex = 0;

        async function fetchLeaderboard() {
            const { data, error } = await supabase.from('leaderboard').select('*').order('attempts', { ascending: true }).limit(10);
            if (error) {
                console.error("Error fetching leaderboard:", error);
                return;
            }
            leaderboard.innerHTML = "";
            data.forEach((entry, index) => {
                const listItem = document.createElement("li");
                listItem.textContent = `${index + 1}. ${entry.name} - ${entry.attempts} attempts`;
                leaderboard.appendChild(listItem);
            });
        }

        async function saveToLeaderboard(playerName, attempts) {
            const { error } = await supabase.from('leaderboard').insert([{ name: playerName, attempts }]);
            if (error) {
                console.error("Error saving to leaderboard:", error);
                return;
            }
            fetchLeaderboard();
        }

        function createGrid() {
            hackerNames.forEach((name, index) => {
                const row = document.createElement("div");
                row.className = "row";
                row.dataset.index = index;
                for (let i = 0; i < 10; i++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    row.appendChild(cell);
                }
                grid.appendChild(row);
            });
            highlightRow(0);
        }

        function highlightRow(index) {
            const rows = document.querySelectorAll(".row");
            rows.forEach(row => row.classList.remove("selected"));
            rows[index].classList.add("selected");
        }

        function clearRowColors(row) {
            const cells = row.querySelectorAll(".cell");
            cells.forEach(cell => {
                cell.classList.remove("correct", "present", "incorrect");
                cell.textContent = "";
            });
        }

        function handleGuess() {
            const rows = document.querySelectorAll(".row");
            const currentRow = rows[selectedRowIndex];
            const cells = currentRow.querySelectorAll(".cell");
            const nameToGuess = hackerNames[selectedRowIndex].toLowerCase();

            clearRowColors(currentRow);

            const guess = input.value.trim().toLowerCase();
            input.value = "";
            attempts++;

            if (!guess) {
                message.textContent = "Enter a name.";
                return;
            }

            guess.split("").forEach((char, i) => {
                const cell = cells[i];
                if (char === nameToGuess[i]) {
                    cell.classList.add("correct");
                    cell.textContent = char;
                } else if (nameToGuess.includes(char)) {
                    cell.classList.add("present");
                    cell.textContent = char;
                } else {
                    cell.classList.add("incorrect");
                    cell.textContent = char;
                }
            });

            if (guess === nameToGuess) {
                message.textContent = "Correct! Well done!";
            } else {
                message.textContent = "Try again!";
            }

            if (attempts === hackerNames.length) {
                const playerName = prompt("Game Over! Enter your name for the leaderboard:");
                if (playerName) {
                    saveToLeaderboard(playerName, attempts);
                }
            }
        }

        grid.addEventListener("click", e => {
            const clickedRow = e.target.closest(".row");
            if (clickedRow) {
                selectedRowIndex = parseInt(clickedRow.dataset.index, 10);
                highlightRow(selectedRowIndex);
            }
        });

        submit.addEventListener("click", handleGuess);

        createGrid();
        fetchLeaderboard();
    </script>
</body>
</html>
